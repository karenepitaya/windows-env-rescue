schema = 1
name = "apps"

# Philosophy: GUI apps are user-owned; this layer only installs curated
# "necessary" tools. Do not add ChatGPT/etc. without an explicit decision.

[[tool]]
id = "vscode"
scoop = "vscode"
bucket = "extras"
binary = "code"
required = true
verify = "code --version"

[[tool]]
id = "cc-switch"
scoop = "cc-switch"
bucket = "extras"
binary = "cc-switch"
required = true
verify = ""
